<style>
        body {
            background-color: #0b1326;
            margin: 0;
            overflow: hidden;
            color: #dae2fd;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .singularity-container {
            perspective: 1000px;
        }
        .liquid-disk {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(65deg);
            width: 320px;
            height: 320px;
            border-radius: 50%;
            border: 8px solid #10b981;
            box-shadow: 0 0 40px #10b981, inset 0 0 40px #10b981;
            filter: blur(1px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .liquid-disk::before {
            content: '';
            position: absolute;
            inset: -15px;
            border-radius: 50%;
            border: 2px solid rgba(16, 185, 129, 0.3);
            animation: ripple 4s infinite linear;
        }
        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.4); opacity: 0; }
        }
        .event-horizon-glow {
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
        }
        .note-display {
            text-shadow: 0 0 20px rgba(78, 222, 163, 0.5);
        }
        .wobble {
            animation: wobble-anim 0.5s ease-in-out infinite alternate;
        }
        @keyframes wobble-anim {
            from { border-radius: 45% 55% 50% 50% / 50% 50% 55% 45%; }
            to { border-radius: 55% 45% 50% 50% / 50% 50% 45% 55%; }
        }
        .glow-pulse {
            animation: pulse-glow 2s infinite alternate;
        }
        @keyframes pulse-glow {
            from { box-shadow: 0 0 30px #10b981; }
            to { box-shadow: 0 0 60px #10b981, 0 0 100px rgba(16, 185, 129, 0.4); }
        }
    </style>

<body class="font-body-md text-body-md overflow-hidden h-screen flex flex-col bg-surface">

<script>
        // Simulation Script for the Pitch Interaction
        const disk = document.getElementById('accretion-disk');
        const marker = document.getElementById('deviation-marker');
        const centsText = document.getElementById('cents-text');
        const noteText = document.getElementById('note-text');
        const freqText = document.getElementById('freq-text');
        
        let currentDev = -12;
        let direction = 1;

        function updateUI() {
            // Update Cents
            currentDev += (direction * 0.5);
            if (currentDev > 5) direction = -1;
            if (currentDev < -15) direction = 1;

            const displayDev = Math.round(currentDev);
            const isClose = Math.abs(displayDev) < 3;

            // Visual feedback on the disk
            if (isClose) {
                disk.classList.remove('wobble');
                disk.classList.add('glow-pulse');
                disk.style.borderColor = '#10b981';
                disk.style.boxShadow = '0 0 60px #10b981, inset 0 0 60px #10b981';
                centsText.textContent = 'Perfect Pitch';
                centsText.className = 'font-mono-data text-mono-data text-primary mt-2 uppercase';
            } else {
                disk.classList.add('wobble');
                disk.classList.remove('glow-pulse');
                disk.style.borderColor = displayDev < 0 ? '#ffb4ab' : '#ffb95f';
                disk.style.boxShadow = `0 0 30px ${displayDev < 0 ? '#ffb4ab' : '#ffb95f'}`;
                centsText.textContent = `${displayDev > 0 ? '+' : ''}${displayDev} Cents`;
                centsText.className = 'font-mono-data text-mono-data text-on-surface-variant mt-2';
            }

            // Update Deviation Slider
            // -50 to 50 maps to 0% to 100%
            const percentage = ((currentDev + 50) / 100) * 80 + 10; // offset for marker width
            marker.style.left = `${percentage}%`;
            marker.style.backgroundColor = isClose ? '#4edea3' : (displayDev < 0 ? '#ffb4ab' : '#ffb95f');

            // Subtle freq jitter
            const baseFreq = 82.41;
            const jitter = (Math.random() * 0.05 - 0.025);
            freqText.innerHTML = `${(baseFreq + jitter).toFixed(2)}<span class="text-label-caps text-on-surface-variant ml-1">Hz</span>`;

            requestAnimationFrame(() => {
                setTimeout(updateUI, 100);
            });
        }

        // Start simulation
        setTimeout(updateUI, 1000);
    </script>
